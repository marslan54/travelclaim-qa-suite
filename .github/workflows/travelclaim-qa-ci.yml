name: TravelClaim QA Suite

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-24.04  # pinned: Playwright 1.49 has no WebKit system deps for 26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: pytest (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-24.04  # pinned: Playwright 1.49 has no WebKit system deps for 26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the package and pinned dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (${{ matrix.browser }})
        run: python -m playwright install ${{ matrix.browser }} --with-deps

      - name: Start TravelClaim demo portal
        run: |
          uvicorn demo_app.main:app --host 127.0.0.1 --port 8765 &
          python - <<'PY'
          import time
          import urllib.request
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=2)
                  break
              except OSError:
                  time.sleep(0.35)
          else:
              raise SystemExit("Demo portal failed to boot")
          PY

      - name: Run pytest in parallel + collect Allure results
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          pytest
          -n auto
          --browser ${{ matrix.browser }}
          --alluredir=reports/allure/${{ matrix.browser }}
          --junitxml=reports/junit-${{ matrix.browser }}.xml

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: travelclaim-allure-${{ matrix.browser }}
          path: reports/allure/${{ matrix.browser }}
          if-no-files-found: warn

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: travelclaim-junit-${{ matrix.browser }}
          path: reports/junit-${{ matrix.browser }}.xml
          if-no-files-found: warn

      - name: Upload screenshots and traces of failed tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: travelclaim-failures-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
