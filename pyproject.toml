[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "travelclaim-qa"
dynamic = ["version"]
description = "Playwright + pytest framework for the TravelClaim portal: page objects, synthetic data and shared fixtures."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Arsalan" }]
dependencies = [
    "playwright>=1.49,<2",
    "pytest>=8.3,<9",
    "pytest-playwright>=0.6,<0.7",
    "pytest-base-url>=2.1,<3",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist>=3.6,<4",
    "allure-pytest>=2.13,<3",
    "ruff>=0.8,<1",
    "pre-commit>=4,<5",
]
demo = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.10,<3",
    "email-validator>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.1,<3",
]

[project.entry-points.pytest11]
travelclaim_qa = "travelclaim_qa.plugin"

[tool.setuptools.packages.find]
include = ["travelclaim_qa*"]

[tool.setuptools.dynamic]
version = { attr = "travelclaim_qa.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results"
base_url = "http://127.0.0.1:8765"
markers = [
    "smoke: quick production confidence checks",
    "regression: broader product coverage",
    "api: service-layer contract tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["travelclaim_qa", "demo_app"]
