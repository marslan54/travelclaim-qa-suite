name: TravelClaim QA Suite

on:
  push:
    branches: ["main"]

jobs:
  travelclaim-matrix:
    name: pytest (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers (${{ matrix.browser }})
        run: python -m playwright install ${{ matrix.browser }} --with-deps

      - name: Start TravelClaim demo portal
        run: |
          uvicorn demo_app.main:app --host 127.0.0.1 --port 8765 &
          python - <<'PY'
          import urllib.request
          import time
          deadline = time.time() + 30
          while time.time() < deadline:
              try:
                  urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=2)
                  break
              except OSError:
                  time.sleep(0.35)
          else:
              raise SystemExit("Demo portal failed to boot")
          PY

      - name: Run pytest + collect Allure results
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          pytest
          tests
          --alluredir=reports/allure/${{ matrix.browser }}
          --browser ${{ matrix.browser }}
          --junitxml=reports/junit-${{ matrix.browser }}.xml

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: travelclaim-allure-${{ matrix.browser }}
          path: reports/allure/${{ matrix.browser }}
          if-no-files-found: warn

      - name: Upload JUnit XML
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: travelclaim-junit-${{ matrix.browser }}
          path: reports/junit-${{ matrix.browser }}.xml
          if-no-files-found: warn
